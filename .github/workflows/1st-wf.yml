name: CI/CD pipeline

on: 
 push: 
  branches: 
   - main

jobs:
 build-and-push:

  runs-on: ubuntu-latest

  steps:
     - name: checkout repo
       uses: actions/checkout@v4

     - name: Docker login
       uses: docker/login-action@v3
       with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
       
     - name: Build
       run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/travel:v1 .
       
     - name: Push
       run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/travel:v1
     
       
